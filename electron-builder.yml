appId: dev.allef.agentoffice
productName: Agent Office
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  # The SDK's platform package carries a full Claude Code binary (~220 MB).
  # Release builds use the user's installed `claude` instead (see src/main/claude-path.ts).
  # To bundle it, delete this line; asarUnpack below keeps it executable.
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*/**'
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
# Auto-update (src/main/updater.ts) reads releases from here; `--publish always`
# (release.yml) uploads the installers and latest*.yml. The token comes from GH_TOKEN.
publish:
  provider: github
  owner: allefrodrigo
  repo: agent-office
# No spaces: GitHub renames them in release assets and the update files would point nowhere.
artifactName: Agent-Office-${version}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  # Modo voz: what macOS shows when the voice button asks for the microphone.
  extendInfo:
    NSMicrophoneUsageDescription: O Agent Office usa o microfone só quando você aperta o botão de voz, para transcrever o que você fala.
  # One build per CPU, not universal: nothing native ships in the package (the SDK's
  # per-CPU Claude binary is left out above), so x64 builds fine on an arm64 Mac, and
  # each download stays half the size of a universal one. The zip feeds the auto-update.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  darkModeSupport: true
  # Developer ID: the certificate comes only from the environment, never from this file:
  # CSC_LINK (.p12 path or base64) + CSC_KEY_PASSWORD, or CSC_NAME for one in the keychain.
  # Without them, scripts/dist-mac.mjs falls back to an ad-hoc signature (identity '-',
  # no hardened runtime), which runs on this Mac only. See README "Assinatura e notarização".
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Notarizes when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set; skipped otherwise.
  notarize: true
dmg:
  title: Agent Office
  # Retina-ready backdrop with a screenshot of the app; regenerate with `npm run dmg-bg`.
  background: resources/background.tiff
  window:
    width: 720
    # Taller than the layout needs: room for Finder bars the user may have on.
    height: 580
  iconSize: 96
  iconTextSize: 13
  # Positions must match APP / APPLICATIONS in scripts/make-dmg-background.mjs.
  contents:
    - x: 200
      y: 380
      type: file
    - x: 520
      y: 380
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch: [x64]
  # Code signing (SmartScreen) also comes from the environment: WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD.
linux:
  # One AppImage runs on most distros with no install; the auto-update reads latest-linux.yml.
  target:
    - target: AppImage
      arch: [x64]
  category: Development
nsis:
  artifactName: Agent-Office-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
