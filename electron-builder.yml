appId: dev.allef.agentoffice
productName: Agent Office
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  # The SDK's platform package carries a full Claude Code binary (~220 MB).
  # Release builds use the user's installed `claude` instead (see src/main/claude-path.ts).
  # To bundle it, delete this line; asarUnpack below keeps it executable.
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*/**'
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
# Auto-update (src/main/updater.ts) reads releases from here; `--publish always`
# (release.yml) uploads the installers and latest*.yml. The token comes from GH_TOKEN.
publish:
  provider: github
  owner: allefrodrigo
  repo: agent-office
# No spaces: GitHub renames them in release assets and the update files would point nowhere.
artifactName: Agent-Office-${version}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  # What macOS shows when the voice button or the meeting room asks for the microphone.
  # Sala de reunião: what macOS shows when the meeting asks for the system audio (ADR 0011).
  # The helper below runs as a child of the app, so the prompt names Agent Office and reads this text.
  extendInfo:
    NSMicrophoneUsageDescription: O Agent Office usa o microfone só quando você aperta o botão de voz ou grava uma reunião na sala de reunião, para transcrever o que é falado no seu Mac.
    NSAudioCaptureUsageDescription: O Agent Office grava o áudio do sistema só durante uma reunião na sala de reunião, para transcrever o que os participantes falam. A transcrição é feita e fica no seu Mac.
  # System audio helper (src/main/meetings/system-audio.ts), built by `npm run native`
  # (dist:mac runs it first). It lands in Contents/Resources/bin; the signing pass walks the
  # whole bundle and signs every Mach-O it finds with the app's identity, hardened runtime
  # and entitlementsInherit, so it needs no `binaries` entry.
  extraResources:
    - from: resources/bin/system-audio-tap
      to: bin/system-audio-tap
  # One build per CPU, not universal: the only native piece is the small helper above (a
  # universal binary of ~230 KB; the SDK's per-CPU Claude binary is left out above), so x64
  # builds fine on an arm64 Mac, and each download stays half the size of a universal one.
  # The zip feeds the auto-update.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  darkModeSupport: true
  # Developer ID: the certificate comes only from the environment, never from this file:
  # CSC_LINK (.p12 path or base64) + CSC_KEY_PASSWORD, or CSC_NAME for one in the keychain.
  # Without them, scripts/dist-mac.mjs falls back to an ad-hoc signature (identity '-',
  # no hardened runtime), which runs on this Mac only. See README "Assinatura e notarização".
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Notarizes when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set; skipped otherwise.
  notarize: true
dmg:
  title: Agent Office
  # Retina-ready backdrop with a screenshot of the app; regenerate with `npm run dmg-bg`.
  background: resources/background.tiff
  window:
    width: 720
    # Taller than the layout needs: room for Finder bars the user may have on.
    height: 580
  iconSize: 96
  iconTextSize: 13
  # Positions must match APP / APPLICATIONS in scripts/make-dmg-background.mjs.
  contents:
    - x: 200
      y: 380
      type: file
    - x: 520
      y: 380
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch: [x64]
  # Code signing (SmartScreen) also comes from the environment: WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD.
linux:
  # One AppImage runs on most distros with no install; the auto-update reads latest-linux.yml.
  target:
    - target: AppImage
      arch: [x64]
  category: Development
nsis:
  artifactName: Agent-Office-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
