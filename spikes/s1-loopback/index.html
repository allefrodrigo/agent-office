<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>S-1 loopback</title>
    <style>
      body { font: 14px -apple-system, sans-serif; margin: 20px; background: #1d1f24; color: #eee; }
      button { font-size: 22px; padding: 14px 28px; width: 100%; border-radius: 10px; border: 0; background: #2f7cf6; color: #fff; cursor: pointer; }
      button:disabled { background: #555; }
      #status { margin: 14px 0; min-height: 2.4em; }
      #meter { height: 22px; background: #333; border-radius: 6px; overflow: hidden; }
      #bar { height: 100%; width: 0; background: #3ccf6e; transition: width 80ms linear; }
    </style>
  </head>
  <body>
    <button id="go">Gravar 60 s</button>
    <div id="status">Pronto.</div>
    <div id="meter"><div id="bar"></div></div>
    <script src="renderer.js"></script>
  </body>
</html>
